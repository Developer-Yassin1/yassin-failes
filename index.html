      } else reject(new Error('Uguu: فشل'));
    };
    xhr.onerror = () => reject(new Error('Uguu: خطأ اتصال'));
    xhr.send(fd);
  });
}

async function uploadFileIO(file, onProgress){
  const services = [
    { name: 'Tmpfiles', fn: uploadToTmpfiles, maxSize: 100 * 1024 * 1024 },
    { name: '0x0.st',   fn: uploadTo0x0,      maxSize: 512 * 1024 * 1024 },
    { name: 'Uguu.se',  fn: uploadToUguu,     maxSize: 128 * 1024 * 1024 }
  ];
  let lastError = null;
  for(const svc of services){
    if(file.size > svc.maxSize) continue;
    try {
      console.log(`🔄 جرب ${svc.name}...`);
      const url = await svc.fn(file, onProgress);
      console.log(`✅ نجح ${svc.name}`);
      return url;
    } catch(err){
      console.warn(`❌ فشل ${svc.name}:`, err.message);
      lastError = err;
    }
  }
  throw new Error('فشل رفع الملف. ' + (lastError?.message || ''));
}

async function uploadFile(file, onProgress){
  const isImg = file.type.startsWith('image/');
  if(isImg){
    if(file.size > 32 * 1024 * 1024) throw new Error('الصورة كبيرة (32MB)');
    return await uploadToImgBB(file, onProgress);
  }
  if(file.size > 512 * 1024 * 1024) throw new Error('الملف كبير جدًا (512MB)');
  return await uploadFileIO(file, onProgress);
}

onAuthStateChanged(auth, async user => {
  if(user){
    CURRENT_UID = user.uid;
    IS_ADMIN = user.uid === ADMIN_UID;
    const snap = await get(ref(db, `users/${user.uid}`));
    CURRENT_USER = snap.exists() ? snap.val() : {
      uid:user.uid, name:user.displayName || 'مستخدم',
      email:user.email, photo:user.photoURL || '',
      createdAt: Date.now(), online: true
    };
    if(!snap.exists()) await set(ref(db, `users/${user.uid}`), CURRENT_USER);
    await set(ref(db, `users/${user.uid}/online`), true);
    await set(ref(db, `users/${user.uid}/lastSeen`), serverTimestamp());
    onDisconnect(ref(db, `users/${user.uid}/online`)).set(false);
    onDisconnect(ref(db, `users/${user.uid}/lastSeen`)).set(serverTimestamp());

    if(productsUnsub) productsUnsub();
    productsUnsub = onValue(ref(db, 'products'), snap => {
      allProducts = snap.val() || {};
      console.log('📦 عدد المنتجات:', Object.keys(allProducts).length);
      if(currentScreen === 'home' && currentTab === 'store'){
        renderStoreTab();
      } else if(currentScreen === 'admin'){
        renderAdmin();
      }
    });

    route('home');
  } else {
    CURRENT_UID = null;
    CURRENT_USER = null;
    IS_ADMIN = false;
    clearListeners();
    if(productsUnsub){ productsUnsub(); productsUnsub = null; }
    allProducts = {};
    route('login');
  }
});

function translateErr(e){
  const m = e.message || '';
  if(m.includes('email-already-in-use')) return 'البريد مسجّل بالفعل';
  if(m.includes('invalid-credential') || m.includes('wrong-password')) return 'بيانات غير صحيحة';
  if(m.includes('user-not-found')) return 'الحساب غير موجود';
  if(m.includes('invalid-email')) return 'بريد غير صالح';
  if(m.includes('weak-password')) return 'كلمة المرور ضعيفة';
  if(m.includes('network')) return 'تعذّر الاتصال';
  if(m.includes('too-many-requests')) return 'محاولات كثيرة';
  return m || 'حدث خطأ';
}

function askForCode(p){
  const modal = document.createElement('div');

    </div>`;
  document.body.appendChild(modal);
  const close = () => modal.remove();
  modal.querySelector('#closeCode').onclick = close;
  modal.onclick = e => { if(e.target === modal) close(); };
  const inp = modal.querySelector('#codeInp');
  inp.focus();
  const submit = () => {
    const code = inp.value.trim();
    if(!code){ modal.querySelector('#codeErr').textContent = 'ادخل الكود'; return; }
    if(code === p.password){ close(); downloadProduct(p); }
    else modal.querySelector('#codeErr').textContent = '❌ الكود غير صحيح';
  };
  modal.querySelector('#submitCode').onclick = submit;
  inp.onkeydown = e => { if(e.key === 'Enter') submit(); };
}

    if(CURRENT_UID){

        pid: p.id, name: p.name, price: p.price || 0,
        type: p.type, downloadedAt: Date.now()

        uid: CURRENT_UID, userName: CURRENT_USER?.name || '',
        pid: p.id, name: p.name, price: p.price || 0,
        type: p.type, downloadedAt: Date.now()
      });
    }
  } catch(e){ console.warn(e); }
  window.open(p.file, '_blank');
  toast('✅ بدأ التحميل', 'ok');
}

        <div id="imgPreview" style="margin-top:10px;text-align:center">${imagePreview ? `<img src="${esc(imagePreview)}" style="max-width:140px;border-radius:14px;border:1px solid var(--border)">` : ''}</div>
        <div class="progress-bar" id="imgProgress" style="display:none"><div id="imgBar"></div></div>
      </div>
      <div class="field">
        <label>ملف المنتج (APK / PDF / ZIP / MP4)</label>
        <input type="file" id="fileFile">
        <div id="fileStatus" style="margin-top:8px;font-size:12px;color:var(--muted)">${filePreview ? `📎 ملف: <a href="${esc(filePreview)}" target="_blank" style="color:var(--gold)">عرض</a>` : ''}</div>
        <div class="progress-bar" id="fileProgress" style="display:none"><div id="fileBar"></div></div>
        <div id="fileHint" style="font-size:11px;color:var(--muted);margin-top:6px">⚡ يرفع تلقائيًا على 3 خدمات</div>
      </div>
      <div style="display:flex;gap:10px;margin:20px 0 30px">
        <label style="display:flex;align-items:center;gap:8px;flex:1"><input type="checkbox" id="pFeat" ${p.featured ? 'checked' : ''} style="width:20px;height:20px;accent-color:var(--gold)"><span style="font-size:13px">⭐ مميز</span></label>
        <label style="display:flex;align-items:center;gap:8px;flex:1"><input type="checkbox" id="pPin" ${p.pinned ? 'checked' : ''} style="width:20px;height:20px;accent-color:var(--gold)"><span style="font-size:13px">📌 مثبّت</span></label>
      </div>
      <button class="btn" id="saveBtn" style="font-size:16px">💾 ${editing ? 'حفظ التعديلات' : 'نشر المنتج'}</button>
      <div style="height:40px"></div>
    </div>`;
  document.getElementById('back').onclick = () => route('home');
  const typeSel = document.getElementById('pType');
  typeSel.onchange = () => {
    document.getElementById('priceWrap').style.display = typeSel.value === 'paid' ? '' : 'none';
    document.getElementById('passWrap').style.display = typeSel.value === 'code' ? '' : 'none';
  };
  document.getElementById('imgFile').onchange = e => {
    newImageFile = e.target.files[0];
    if(newImageFile) document.getElementById('imgPreview').innerHTML = `<img src="${URL.createObjectURL(newImageFile)}" style="max-width:140px;border-radius:14px;border:1px solid var(--border)">`;
  };
  document.getElementById('fileFile').onchange = e => {
    newProductFile = e.target.files[0];
    if(newProductFile) document.getElementById('fileStatus').innerHTML = `📎 جاهز: <b>${esc(newProductFile.name)}</b> (${(newProductFile.size/1024/1024).toFixed(2)} MB)`;
  };
  document.getElementById('saveBtn').onclick = async () => {
    const name = document.getElementById('pName').value.trim();
    const description = document.getElementById('pDesc').value.trim();
    const category = document.getElementById('pCat').value;
    const type = document.getElementById('pType').value;
    const price = document.getElementById('pPrice').value.trim();
    const password = document.getElementById('pPass').value.trim();
    const youtube = document.getElementById('pYt').value.trim();
    const featured = document.getElementById('pFeat').checked;
    const pinned = document.getElementById('pPin').checked;
    if(!name){ toast('اسم المنتج مطلوب', 'err'); return; }
    if(type === 'code' && !password){ toast('ادخل الكود السري', 'err'); return; }
    const btn = document.getElementById('saveBtn');
    btn.disabled = true; btn.textContent = '⏳ جاري الحفظ...';
    try {
      let imageUrl = p.image || '';
      let fileUrl = p.file || '';
      if(newImageFile){
        const pw = document.getElementById('imgProgress');
        const pb = document.getElementById('imgBar');
        pw.style.display = 'block';
        imageUrl = await uploadFile(newImageFile, prog => { pb.style.width = prog + '%'; });
        pw.style.display = 'none';
      }
      if(newProductFile){
        const pw = document.getElementById('fileProgress');
        const pb = document.getElementById('fileBar');
        pw.style.display = 'block';
        fileUrl = await uploadFile(newProductFile, prog => { pb.style.width = prog + '%'; });
        pw.style.display = 'none';
      }
      const pid = editing ? p.id : push(ref(db, 'products')).key;
      const data = {
        id: pid, name, description, category, type,
        price: type === 'paid' ? (parseFloat(price) || 0) : 0,
        password: type === 'code' ? password : '',
        youtube, image: imageUrl, file: fileUrl,
        featured, pinned,
        createdAt: p.createdAt || Date.now(),
        updatedAt: Date.now(),
        createdBy: p.createdBy || CURRENT_UID,
        downloads: p.downloads || 0
      };
      await set(ref(db, `products/${pid}`), data);
      allProducts[pid] = data;
      toast(editing ? 'تم التعديل ✅' : 'تم النشر 🎉', 'ok');
      setTimeout(() => route('home'), 400);
    } catch(e){
      console.error(e);
      toast(e.message || 'فشل الحفظ', 'err');
      btn.disabled = false;
      btn.textContent = editing ? '💾 حفظ التعديلات' : '🚀 نشر المنتج';
    }
  };
}

function renderAdmin(){
  if(!IS_ADMIN){
    $app.innerHTML = `<div class="empty"><div class="big">🚫</div><div class="title">ممنوع الوصول</div></div>`;
    return;
  }
  const products = Object.values(allProducts || {});
  const totalDownloads = products.reduce((s, p) => s + (p.downloads || 0), 0);
  const totalPaid = products.filter(p => p.type === 'paid').length;
  const totalFree = products.filter(p => p.type === 'free' || p.type === 'code').length;
  $app.innerHTML = `
    <div class="topbar"><button class="icon-btn" id="back">←</button><h1>لوحة التحكم</h1></div>
    <div class="page" style="padding:20px">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px">
        <div style="background:linear-gradient(135deg,rgba(212,175,55,.2),rgba(124,58,237,.15));padding:18px;border-radius:16px;border:1px solid var(--border);text-align:center">
          <div style="font-size:32px;font-weight:900;font-family:'Orbitron',sans-serif;color:var(--gold)">${products.length}</div>
          <div style="font-size:12px;color:var(--muted);margin-top:4px">منتج</div>
        </div>
        <div style="background:linear-gradient(135deg,rgba(16,185,129,.2),rgba(52,211,153,.1));padding:18px;border-radius:16px;border:1px solid rgba(16,185,129,.3);text-align:center">
          <div style="font-size:32px;font-weight:900;font-family:'Orbitron',sans-serif;color:#10b981">${totalDownloads}</div>
          <div style="font-size:12px;color:var(--muted);margin-top:4px">تحميل</div>
        </div>
        <div style="background:var(--glass);padding:16px;border-radius:16px;border:1px solid var(--border-2);text-align:center">
          <div style="font-size:24px;font-weight:900;color:var(--gold)">${totalPaid}</div>
          <div style="font-size:11px;color:var(--muted);margin-top:4px">💰 مدفوع</div>
        </div>
        <div style="background:var(--glass);padding:16px;border-radius:16px;border:1px solid var(--border-2);text-align:center">
          <div style="font-size:24px;font-weight:900;color:var(--success)">${totalFree}</div>
          <div style="font-size:11px;color:var(--muted);margin-top:4px">🆓 مجاني</div>
        </div>
      </div>
      <button class="btn" id="addNew" style="margin-bottom:20px">➕ إضافة منتج جديد</button>
      <div class="section-title" style="padding:0 0 10px"><h2><span class="dash"></span>📦 كل المنتجات</h2></div>
      ${products.length === 0 ? `<div class="empty"><div class="big">📦</div><div class="title">لا منتجات بعد</div></div>`
        : products.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)).map(p => {
        const isFree = !p.price || p.price === 0;
        return `<div style="background:var(--glass);border:1px solid var(--border-2);border-radius:14px;padding:12px;margin-bottom:10px;display:flex;gap:12px;align-items:center">
          <div style="width:60px;height:60px;border-radius:12px;overflow:hidden;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:28px;flex-shrink:0">
            ${p.image ? `<img src="${esc(p.image)}" style="width:100%;height:100%;object-fit:cover">` : '📦'}
          </div>
          <div style="flex:1;min-width:0">
            <div style="font-weight:700;font-size:14px;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(p.name)}</div>
            <div style="font-size:11px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap">
              <span>${isFree ? '🆓' : '💰 ' + p.price + 'ج.م'}</span>
              <span>⬇️ ${p.downloads || 0}</span>
              <span>${timeAgo(p.createdAt)}</span>
            </div>
          </div>
          <div style="display:flex;gap:6px">
            <button class="icon-btn" data-edit="${esc(p.id)}" style="color:var(--gold)">✏️</button>
            <button class="icon-btn" data-del="${esc(p.id)}" style="color:var(--danger)">🗑️</button>
          </div>
        </div>`;
      }).join('')}
    </div>`;
  document.getElementById('back').onclick = () => route('home');
  document.getElementById('addNew').onclick = () => route('add-product');
  document.querySelectorAll('[data-edit]').forEach(b => {
    b.onclick = () => route('add-product', { id: b.dataset.edit });
  });
  document.querySelectorAll('[data-del]').forEach(b => {
    b.onclick = async () => {
      if(!confirm('حذف المنتج؟')) return;
      try {
        await remove(ref(db, `products/${b.dataset.del}`));
        delete allProducts[b.dataset.del];
        toast('تم الحذف', 'ok');
        renderAdmin();
      } catch(e){ toast('فشل', 'err'); }
    };
  });
}

function renderOrders(){
  $app.innerHTML = `
    <div class="topbar"><button class="icon-btn" id="back">←</button><h1>مشترياتي</h1></div>
    <div class="page" id="ordersPage"><div class="empty"><div class="big">⏳</div><div class="title">جاري التحميل...</div></div></div>`;
  document.getElementById('back').onclick = () => { currentTab = 'store'; route('home'); };
  const off = onValue(ref(db, `orders/${CURRENT_UID}`), snap => {
    const data = snap.val() || {};
    const orders = Object.values(data).sort((a,b) => (b.downloadedAt||0)-(a.downloadedAt||0));
    const container = document.getElementById('ordersPage');
    if(!container) return;
    if(orders.length === 0){
      container.innerHTML = `<div class="empty"><div class="big">📦</div><div class="title">لا مشتريات بعد</div><div class="sub">تصفح المتجر وحمّل منتجاتك</div></div>`;
      return;
    }
    container.innerHTML = orders.map(o => `
      <div style="background:var(--glass);border:1px solid var(--border-2);border-radius:14px;margin:10px 14px;padding:12px;display:flex;gap:12px">
        <div style="width:50px;height:50px;border-radius:12px;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0">${o.type === 'paid' ? '💰' : '🆓'}</div>
        <div style="flex:1;min-width:0">
          <div style="font-weight:700;font-size:14px;margin-bottom:4px">${esc(o.name)}</div>
          <div style="font-size:11px;color:var(--muted)">${o.price > 0 ? o.price + ' ج.م' : 'مجاني'} • ${timeAgo(o.downloadedAt)}</div>
        </div>
      </div>
    `).join('');
  });
  listeners.push(off);
}

function renderProfile(){
  $app.innerHTML = `
    <div class="topbar"><button class="icon-btn" id="back">←</button><h1>حسابي</h1></div>
    <div class="page" style="padding:24px 20px;text-align:center">
      <div class="av" style="width:100px;height:100px;margin:0 auto 16px;font-size:36px;background:linear-gradient(135deg,var(--gold),var(--purple2));color:#fff">
        ${CURRENT_USER?.photo ? `<img src="${esc(CURRENT_USER.photo)}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">` : initials(CURRENT_USER?.name)}
      </div>
      <h2 style="font-size:22px;font-weight:800;margin-bottom:4px">${esc(CURRENT_USER?.name || 'مستخدم')}</h2>
      <div style="color:var(--muted);font-size:13px">${esc(CURRENT_USER?.email || '')}</div>
      ${IS_ADMIN ? `<div style="margin-top:10px"><span class="chip active" style="font-size:11px">👑 Admin</span></div>` : ''}
      <div style="margin-top:30px;display:flex;flex-direction:column;gap:10px">
        ${IS_ADMIN ? `<button class="btn btn-primary" id="adminBtn">⚙️ لوحة التحكم</button>` : ''}
        <button class="btn btn-ghost" id="themeBtn">${THEME === 'dark' ? '☀️ الوضع النهاري' : '🌙 الوضع الليلي'}</button>
        <button class="btn btn-danger" id="logoutBtn">🚪 تسجيل الخروج</button>
      </div>
      <div style="margin-top:40px;font-size:11px;color:var(--muted)">Yassin_Vip-HUP © ${new Date().getFullYear()}</div>
    </div>`;
  document.getElementById('back').onclick = () => route('home');
  document.getElementById('themeBtn').onclick = toggleTheme;
  document.getElementById('adminBtn')?.addEventListener('click', () => route('admin'));
  document.getElementById('logoutBtn').onclick = async () => {
    if(confirm('تسجيل الخروج؟')){
      if(CURRENT_UID) await set(ref(db, `users/${CURRENT_UID}/online`), false);
      await signOut(auth);
    }

}
